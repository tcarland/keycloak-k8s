apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: keycloak
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    # Management port — exposes health and metrics endpoints.
    - port: 9000
      targetPort: management
      protocol: TCP
      name: management
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
