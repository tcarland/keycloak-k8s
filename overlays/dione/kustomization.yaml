apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  - ../../base
  #- keycloak-ingress.yaml

secretGenerator:
  - name: keycloak-db-credentials
    envs:
      - db.env
  - name: keycloak-tls
    type: kubernetes.io/tls
    files: 
      - tls.crt
      - tls.key
generatorOptions:
  disableNameSuffixHash: true
  
patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - start
          - --import-realm
          - --http-enabled=true
          - --http-port=8080
          - --https-port=8443
          - --https-certificate-file=/etc/keycloak/tls/tls.crt
          - --https-certificate-key-file=/etc/keycloak/tls/tls.key
          - --http-management-scheme=http
          - --hostname-strict=false
          - --db=postgres
          #- --proxy-headers=forwarded  #  if using ingress with TLS termination.
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          containerPort: 8443
          name: https
          protocol: TCP
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: keycloak-tls
          mountPath: /etc/keycloak/tls
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: keycloak-tls
          secret:
            secretName: keycloak-tls
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_DB_URL
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: url
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: username
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: password
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/strategy/type
        value: RollingUpdate

  - target:
      kind: PersistentVolumeClaim
      name: keycloak-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi

  # Expose HTTPS port (8443) for direct TLS.
  - target:
      kind: Service
      name: keycloak
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          port: 8443
          targetPort: https
          protocol: TCP
          name: https

images:
  - name: quay.io/keycloak/keycloak
    newTag: "26.7.1"
