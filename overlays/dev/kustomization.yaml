apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  - ../../base

# Dev-specific patches: smaller resources suitable for local clusters.
patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi

  - target:
      kind: PersistentVolumeClaim
      name: keycloak-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 256Mi

images:
  - name: quay.io/keycloak/keycloak
    newTag: "26.7.1"
